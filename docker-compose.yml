version: '3.8'

services:
  # Service for your Node.js Telegram bot
  bot:
    build:
      context: .
    container_name: epic-bot
    restart: always
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npx sequelize-cli db:migrate && npm run dev"
    networks:
      - bot_network
    depends_on:
      db:
        condition: service_healthy

  # Service for the MySQL database
  db:
    image: mysql:8
    container_name: mysql-database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    env_file:
      - .env
    ports:
      - "33106:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bot_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:

networks:
  bot_network:
    driver: bridge