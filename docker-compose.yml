version: '3.8'

services:
  # Service for your Node.js Telegram bot
  bot:
    build:
      context: .
    container_name: epic-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
      # Named volume: reused on every start (an anonymous one created a new copy each restart and filled the disk).
      # After changing dependencies, refresh it with: docker volume rm epic-bot_node_modules
      - node_modules:/app/node_modules
      - pixverse_config:/root/.config
      - pixverse_home:/root/.pixverse
    command: sh -c "npx sequelize-cli db:migrate && npm run dev"
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bot_network
    depends_on:
      db:
        condition: service_healthy

  # Service for the MySQL database
  db:
    image: mysql:8
    container_name: mysql-database
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    env_file:
      - .env
    ports:
      - "33106:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bot_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
  node_modules:
  pixverse_config:
  pixverse_home:

networks:
  bot_network:
    driver: bridge